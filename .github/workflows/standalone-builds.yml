# Builds the standalone (no-Python-required) PyInstaller bundle for each of
# the six platforms whale/hw/_vendor/ carries native libhamlib/PortAudio
# binaries for. Every leg builds *natively* on/for its own target -- there is
# no cross-compilation of the Python/PyInstaller build itself -- so each job
# can bundle that platform's own vendored native libraries, exactly the way
# packaging/pyinstaller/whale.spec resolves them via platform_tag() at
# build time. The linux-aarch64/linux-armv7 legs still run on amd64 GitHub
# runners, but only the *container* is emulated (QEMU); inside that emulated
# container the build is native to the target arch.
#
# Every build is retained as a workflow artifact. For a v* tag, once every
# platform build succeeds, the archives are also published on the matching
# public GitHub Release. Manual runs remain artifacts-only.

name: Standalone builds

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

# Least-privilege default. Only the release job below receives write access.
permissions:
  contents: read

jobs:
  # Publishing must be backed by the same complete test suite used for
  # ordinary push/PR CI.  Keeping this job in the release workflow makes the
  # dependency explicit and prevents a tag from publishing when tests fail.
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run full test suite
        run: python -m pytest -q

  # Single source of truth for the version string used in every archive
  # name, so a manual workflow_dispatch run and a `git push --tags` run both
  # produce sensibly named artifacts.
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - id: compute
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

  # linux-x86_64: native amd64 runner, but the actual PyInstaller build runs
  # inside a debian:trixie container -- matching the Debian trixie baseline
  # that scripts/vendor_hamlib.py and scripts/vendor_portaudio.py pulled the
  # vendored libhamlib/libusb/libportaudio binaries from, for glibc/ABI
  # consistency with those exact .so files. Not `-slim`: the full image's
  # extra packages are cheap here and avoid guessing which slim-image gaps
  # matter, since apt-get is already being used for build tooling.
  build-linux-x86_64:
    needs: compute-version
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # git must exist before actions/checkout can do anything in a
      # container job; libasound2t64/libjack-jackd2-0 are the runtime
      # libraries the earlier local Docker validation found were needed on
      # the *smoke-test* side even with PortAudio itself vendored (PortAudio
      # still dlopen's ALSA/JACK at run time; see whale/hw/audio_io.py's
      # frozen-mode preload comment). libpython3-dev pulls in
      # libpython3.X.so.1.0, which PyInstaller must bundle; Debian's python3
      # binary is statically linked and doesn't ship it by default.
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates binutils \
            python3 python3-venv python3-pip libpython3-dev \
            libasound2t64 libjack-jackd2-0
      - uses: actions/checkout@v7
      - name: Install project + build deps
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[test]"
          pip install pyinstaller
      - name: Build standalone bundle
        run: |
          . .venv/bin/activate
          pyinstaller packaging/pyinstaller/whale.spec
      - name: Smoke test
        run: |
          dist/whale/whale-server --help
          dist/whale/whale-configure --help
          . .venv/bin/activate
          python3 -c "import whale.hw.hamlib, whale.hw.audio_io"
      - name: Archive bundle
        run: |
          cd dist
          tar czf "whale-linux-x86_64.tar.gz" whale
      - uses: actions/upload-artifact@v7
        with:
          name: whale-linux-x86_64
          path: dist/whale-linux-x86_64.tar.gz

  # linux-aarch64 / linux-armv7: also amd64 GitHub runners, cross-arch via
  # QEMU user-mode emulation registered by setup-qemu-action, the same
  # technique (generalized) used to cross-build/validate the linux-x86_64
  # bundle from arm64 during local development. `docker run --platform`
  # against debian:trixie makes the *build itself* run natively for the
  # target arch inside the emulated container -- there is no separate
  # cross-compiler toolchain involved, just a slower (QEMU-interpreted) CPU.
  # This can be genuinely slow, especially if numpy/scipy have no prebuilt
  # wheel for a given arch and pip falls back to a source build under
  # emulation; a generous timeout is set for that reason.
  build-linux-cross:
    needs: compute-version
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: linux-aarch64
            docker_platform: linux/arm64
            system_numpy: "0"
          # numpy/scipy publish no armv7 wheels, and a source build of both
          # under QEMU is fragile and can blow the timeout, so this leg uses
          # Debian's prebuilt python3-numpy/python3-scipy via a venv with
          # --system-site-packages instead.
          - tag: linux-armv7
            docker_platform: linux/arm/v7
            system_numpy: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build + smoke test inside emulated debian:trixie
        run: |
          docker run --rm --platform "${{ matrix.docker_platform }}" \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            -e SYSTEM_NUMPY="${{ matrix.system_numpy }}" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            debian:trixie bash -c '
              set -eux
              # The container runs as root, so everything it writes into the
              # bind-mounted workspace (dist/, build/, .venv, egg-info) would
              # be root-owned and unwritable by later host steps (e.g. tar
              # into dist/). Hand ownership back on exit, even on failure.
              trap "chown -R \"\$HOST_UID:\$HOST_GID\" /workspace" EXIT
              apt-get update
              # build-essential/gfortran/libopenblas-dev/python3-dev/pkg-config
              # are a safety net in case some dependency has no prebuilt wheel
              # for this arch and pip falls back to building from source under
              # emulation -- slow, but this is CI, not a Raspberry Pi doing its
              # own build. (python3-dev is what meson needs to find the python3
              # dependency for Cython extensions.) libpython3-dev is listed
              # explicitly because PyInstaller needs libpython3.X.so.1.0 to
              # bundle, and the Debian python3 binary does not link to it.
              # libffi-dev covers a source build of cffi (via sounddevice),
              # which has no armv7 wheel.
              apt-get install -y --no-install-recommends \
                ca-certificates \
                python3 python3-venv python3-pip python3-dev libpython3-dev pkg-config \
                build-essential gfortran libopenblas-dev libffi-dev \
                libasound2t64 libjack-jackd2-0
              if [ "$SYSTEM_NUMPY" = "1" ]; then
                apt-get install -y --no-install-recommends \
                  python3-numpy python3-scipy python3-cffi
                python3 -m venv --system-site-packages .venv
              else
                python3 -m venv .venv
              fi
              . .venv/bin/activate
              pip install --upgrade pip
              pip install -e ".[test]"
              pip install pyinstaller
              pyinstaller packaging/pyinstaller/whale.spec
              dist/whale/whale-server --help
              dist/whale/whale-configure --help
              python3 -c "import whale.hw.hamlib, whale.hw.audio_io"
            '
      - name: Archive bundle
        run: |
          cd dist
          tar czf "whale-${{ matrix.tag }}.tar.gz" whale
      - uses: actions/upload-artifact@v7
        with:
          name: whale-${{ matrix.tag }}
          path: dist/whale-${{ matrix.tag }}.tar.gz

  # macos-arm64 / macos-x86_64: real, native Apple Silicon / Intel runners.
  # No QEMU/Rosetta needed -- macos-15-intel is GitHub's oldest supported
  # standard Intel image, while macos-14 is Apple Silicon. The mac
  # dylib relocation (install_name_tool + ad-hoc codesign) already happened
  # once, at vendor time, in scripts/vendor_hamlib.py; this build just
  # bundles the already-relocated .dylib as data, it doesn't redo that step.
  build-macos:
    needs: compute-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            tag: macos-arm64
          - os: macos-15-intel
            tag: macos-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project + build deps
        run: |
          python3 -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install pyinstaller
      - name: Build standalone bundle
        run: pyinstaller packaging/pyinstaller/whale.spec
      - name: Smoke test
        run: |
          dist/whale/whale-server --help
          dist/whale/whale-configure --help
          python3 -c "import whale.hw.hamlib, whale.hw.audio_io"
      - name: Archive bundle
        run: |
          cd dist
          zip -r "whale-${{ matrix.tag }}.zip" whale
      - uses: actions/upload-artifact@v7
        with:
          name: whale-${{ matrix.tag }}
          path: dist/whale-${{ matrix.tag }}.zip

  # windows-x86_64: native runner, sounddevice's wheel already bundles
  # PortAudio on Windows so there's no vendored-PortAudio preload step to
  # worry about here (see whale/hw/audio_io.py); only the vendored hamlib
  # DLLs (from Hamlib's own official w64 release zip) get bundled, per the
  # spec.
  build-windows-x86_64:
    needs: compute-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install pyinstaller
      - name: Build standalone bundle
        run: pyinstaller packaging/pyinstaller/whale.spec
      - name: Smoke test
        run: |
          dist\whale\whale-server.exe --help
          dist\whale\whale-configure.exe --help
          python -c "import whale.hw.hamlib, whale.hw.audio_io"
      - name: Archive bundle
        run: |
          Compress-Archive -Path dist\whale -DestinationPath "dist\whale-windows-x86_64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: whale-windows-x86_64
          path: dist/whale-windows-x86_64.zip

  publish-release:
    if: github.ref_type == 'tag'
    needs:
      - test
      - build-linux-x86_64
      - build-linux-cross
      - build-macos
      - build-windows-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all standalone bundles
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum whale-* > SHA256SUMS
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" * --clobber --repo "$GITHUB_REPOSITORY"
