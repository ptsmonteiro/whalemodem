# Copy this file anywhere, edit it, and pass --radio-config PATH (or set
# WHALE_RADIO_CONFIG). With neither, radios.toml in the current directory is
# used -- see the repo root's radios.toml for the original bench's
# ic705/ic7300/ht inventory.

# Optional: the radio used when --radio is omitted. Must name one of the
# [radios.*] tables below, and must come before any table header. A file
# with only one [radios.*] table defaults to it implicitly even without
# this key.
# default_radio = "shack-icom"

[radios.shack-icom]
name = "Icom controlled over CI-V"
audio.input = "IC-705"
audio.output = "IC-705"
channels = ["fm", "hf"] # which --channel values this radio may be selected for -- at least one, both allowed
ptt.backend = "icom-civ"
ptt.usb_id = "0C26:0036"
ptt.address = 0xA4

[radios.digirig]
audio.input = "USB Audio Device"
audio.output = "USB Audio Device"
channels = ["fm"]
ptt.backend = "serial-line"
ptt.port = "/dev/ttyUSB0"
ptt.line = "rts" # or "dtr"

[radios.rigctl]
audio.input = "USB Audio CODEC"
audio.output = "USB Audio CODEC"
channels = ["hf"]
ptt.backend = "hamlib"
ptt.model = 3073 # rig model number; see `rigctl -l`, or `rigctl -m 1` for the no-hardware dummy rig
ptt.device = "/dev/ttyUSB0"
ptt.baud = 115200

[radios.audio-vox]
audio.input = "Built-in Audio"
audio.output = "Built-in Audio"
channels = ["fm"]
ptt.backend = "vox"
