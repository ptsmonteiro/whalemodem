name: CI

on:
  push:
  pull_request:

# The test result from this workflow is the required branch-protection check.
# Tag releases run the identical suite in standalone-builds.yml before assets
# can be published.
permissions:
  contents: read

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run full test suite
        run: python -m pytest -q
