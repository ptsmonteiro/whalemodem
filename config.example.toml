# Copy this file anywhere, edit it, and pass --config PATH (or set
# WHALE_CONFIG). With neither, config.toml in the current directory is used.

callsign = "N0CALL"
# ssid = 1
default_fm_radio = "shack-icom"
default_hf_radio = "shack-icom"
# cmd_port = 8300
# data_port = 8301
# log_file = "whale.log" # omit to log to stderr

[radios.shack-icom]
name = "Icom controlled over CI-V"
audio.input = "IC-705"
audio.output = "IC-705"
channels = ["fm", "hf"] # which --channel values this radio may be selected for -- at least one, both allowed
ptt.backend = "icom-civ"
ptt.usb_id = "0C26:0036"
ptt.address = 0xA4

[radios.digirig]
audio.input = "USB Audio Device"
audio.output = "USB Audio Device"
channels = ["fm"]
ptt.backend = "serial-line"
ptt.port = "/dev/ttyUSB0"
ptt.line = "rts" # or "dtr"

[radios.rigctl]
audio.input = "USB Audio CODEC"
audio.output = "USB Audio CODEC"
channels = ["hf"]
ptt.backend = "hamlib"
ptt.model = 3073 # rig model number; see `rigctl -l`, or `rigctl -m 1` for the no-hardware dummy rig
ptt.device = "/dev/ttyUSB0"
ptt.baud = 115200

[radios.audio-vox]
audio.input = "Built-in Audio"
audio.output = "Built-in Audio"
channels = ["fm"]
ptt.backend = "vox"
