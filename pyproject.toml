[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whale"
version = "0.0.1rc6"
description = "A VARA-API-shaped amateur radio data modem"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Pedro Monteiro" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "sounddevice",
    "pyserial",
    "windows-curses; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
whale-server = "whale.vara_server:main"
whale-configure = "whale.config_tui:main"
whale-test = "whale.test_cli:main"

[tool.setuptools]
packages = ["whale", "whale.dsp", "whale.hw", "whale.modes", "whale.phy"]

[tool.setuptools.package-data]
"whale.hw" = ["_vendor/hamlib/**/*"]
# acceptance_test.py lives at the repo root and is both run directly
# (`python acceptance_test.py ...`) and imported by two scripts. Declaring it
# here is what makes `from acceptance_test import StationClient` resolve from
# scripts/, which is otherwise sys.path[0] and knows nothing about the root.
py-modules = ["acceptance_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "channel_regression: bounded fixed-seed simulated-channel regression points",
]
