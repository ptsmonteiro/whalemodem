# Copy this file anywhere, edit it, and pass --radio-config PATH. The legacy
# ic705/ic7300/ht names remain available when no inventory is selected.

[radios.shack-icom]
description = "Icom controlled over CI-V"
audio_name = "IC-705"
ptt.backend = "icom-civ"
ptt.usb_id = "0C26:0036"
ptt.radio_name = "IC-705"
ptt.address = 0xA4

[radios.digirig]
audio_name = "USB Audio Device"
ptt.backend = "serial-line"
ptt.port = "/dev/ttyUSB0"
ptt.line = "rts" # or "dtr"

[radios.rigctl]
audio_name = "USB Audio CODEC"
ptt.backend = "hamlib"
ptt.model = 3073 # rig model number; see `rigctl -l`, or `rigctl -m 1` for the no-hardware dummy rig
ptt.device = "/dev/ttyUSB0"
ptt.baud = 115200

[radios.audio-vox]
audio_name = "Built-in Audio"
ptt.backend = "vox"
